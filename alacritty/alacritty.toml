[general]
working_directory = "/home/nikkie/Documents/Projects"

[window]
decorations = "None"
startup_mode = "Windowed"
position = { x = 2560, y=15 }
dimensions = { columns = 315, lines = 86 }
padding = { x = 12, y = 16 }
option_as_alt = "OnlyLeft"

[colors.primary]
background = "#24283b"

[font]
size = 14.0

[font.normal]
family = "Liga SFMono Nerd Font"
style = "Regular"

[font.bold]
family = "Liga SFMono Nerd Font"
style = "Bold"

[font.italic]
family = "Liga SFMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Liga SFMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Underline", blinking = "Off" }

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
	{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" }
]
